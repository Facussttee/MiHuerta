<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Huerta - Verdulería Digital</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col selection:bg-emerald-200">

  <!-- Barra Superior del Simulador (Permite alternar entre Cliente, Operario y Dueño) -->
  <aside class="bg-slate-950 text-white px-3 py-2 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-sm font-black tracking-tight flex items-center gap-1.5 text-emerald-400">
          <span>🥕</span> MiHuerta
        </span>
        <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">
          Simulador
        </span>
      </div>

      <!-- Selector de Vistas -->
      <nav class="flex items-center bg-slate-900 p-0.5 rounded-xl border border-slate-800 text-xs font-bold">
        <button 
          data-view="client" 
          class="nav-switch px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5"
          title="Vista del cliente que entra al link del bot"
        >
          <span>🛒</span>
          <span>Cliente</span>
        </button>

        <button 
          data-view="operator" 
          class="nav-switch px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5"
          title="Vista de la verdulería para pesar productos"
        >
          <span>⚖️</span>
          <span>Operario (Balanza)</span>
        </button>

        <button 
          data-view="admin" 
          class="nav-switch px-2.5 py-1.5 rounded-lg transition flex items-center gap-1.5"
          title="Panel rápido del dueño para actualizar precios"
        >
          <span>⚙️</span>
          <span>Dueño</span>
        </button>
      </nav>
    </div>
  </aside>

  <!-- Contenedor Principal donde se renderizan las vistas -->
  <div id="app-content" class="flex-1 w-full"></div>

  <!-- Script Autónomo (Compatible con file:/// y doble clic sin servidor) -->
  <script src="js/bundle.js"></script>
</body>
</html>
