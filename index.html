<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Huerta - Verdulería Digital</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'
            }
          }
        }
      }
    }
  </script>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col selection:bg-emerald-100 selection:text-emerald-900">

  <!-- Barra Superior del Simulador (Sin emojis, minimalista y mobile-first) -->
  <aside class="bg-slate-950 text-white px-3 py-2 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <span class="text-xs font-black tracking-widest uppercase text-emerald-400">
          Mi Huerta
        </span>
        <span class="text-[9px] uppercase font-bold tracking-widest px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">
          Modo Demo
        </span>
      </div>

      <!-- Selector de Vistas / Roles -->
      <nav class="flex items-center bg-slate-900 p-0.5 rounded-xl border border-slate-800 text-xs font-semibold">
        <button 
          data-view="client" 
          class="nav-switch px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white"
          title="Vista del cliente"
        >
          Cliente
        </button>

        <button 
          data-view="operator" 
          class="nav-switch px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white"
          title="Vista del operario y pesaje"
        >
          Operario
        </button>

        <button 
          data-view="admin" 
          class="nav-switch px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white"
          title="Panel de precios y catálogo"
        >
          Precios
        </button>
      </nav>
    </div>
  </aside>

  <!-- Contenedor Principal donde se renderizan las vistas -->
  <div id="app-content" class="flex-1 w-full"></div>

  <!-- Script Autónomo (Compatible con file:/// y doble clic sin servidor) -->
  <script src="js/bundle.js"></script>
</body>
</html>
